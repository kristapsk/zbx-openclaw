          trigger_prototypes:
            - uuid: 0a95c52d6cb24dc28ed961ada55f394b
              expression: max(/Template App OpenClaw Gateway/net.tcp.listen[{#PORT}],2m)=0
              name: 'OpenClaw [{#NAME}]: Gateway port is not listening'
              priority: HIGH
              description: The OpenClaw Gateway port has not been listening for two minutes.
              tags:
                - tag: scope
                  value: availability
            - uuid: 8561fb1cfc6b449b854a3e0997c684ea
              expression: '{$OPENCLAW_COST_DAILY_WARN_USD}>0 and last(/Template App OpenClaw Gateway/openclaw.prometheus.metrics_present[{#NAME}])=1 and (last(/Template App OpenClaw Gateway/openclaw.model.cost.usd.total[{#NAME}])-min(/Template App OpenClaw Gateway/openclaw.model.cost.usd.total[{#NAME}],1d))>{$OPENCLAW_COST_DAILY_WARN_USD}'
              name: 'OpenClaw [{#NAME}]: Daily model cost is high'
              priority: WARNING
              description: Disabled by default. Set {$OPENCLAW_COST_DAILY_WARN_USD} to a positive amount to enable it.
              tags:
                - tag: scope
                  value: capacity
            - uuid: e1d06bcc9560475a808ef404efb85bed
              expression: "min(/Template App OpenClaw Gateway/openclaw.prometheus.metrics_present[{#NAME}],10m)=1\nand\n(\n  last(/Template App OpenClaw Gateway/openclaw.diagnostics.queue.dropped.total[{#NAME}])\n  -\n  min(/Template App OpenClaw Gateway/openclaw.diagnostics.queue.dropped.total[{#NAME}],10m)\n)>0\n"
              name: 'OpenClaw [{#NAME}]: Diagnostic events are being dropped'
              priority: WARNING
              tags:
                - tag: scope
                  value: capacity
            - uuid: b15be5ef232842fd85e5ea432cc80897
              expression: max(/Template App OpenClaw Gateway/openclaw.http.health["http://{#HOST}:{#PORT}{#HEALTH_PATH}"],3m)=0 and last(/Template App OpenClaw Gateway/net.tcp.listen[{#PORT}])=1
              name: 'OpenClaw [{#NAME}]: Health endpoint is failing'
              priority: HIGH
              description: The Gateway port is listening, but the health endpoint has not returned HTTP 200 for three minutes.
              tags:
                - tag: scope
                  value: availability
            - uuid: d10c46b2008f48b186045561821c813a
              expression: avg(/Template App OpenClaw Gateway/openclaw.http.latency_ms["http://{#HOST}:{#PORT}{#HEALTH_PATH}"],5m)>{$OPENCLAW_LATENCY_WARN_MS} and last(/Template App OpenClaw Gateway/openclaw.http.health["http://{#HOST}:{#PORT}{#HEALTH_PATH}"])=1
              name: 'OpenClaw [{#NAME}]: Health endpoint latency is high'
              priority: WARNING
              description: Average local health-endpoint latency exceeds the configured threshold.
              tags:
                - tag: scope
                  value: performance
            - uuid: 46e4ece003fb4fe3879b331092d60d61
              expression: "min(/Template App OpenClaw Gateway/openclaw.prometheus.metrics_present[{#NAME}],15m)=1\nand\n(\n  last(/Template App OpenClaw Gateway/openclaw.liveness.warnings.total[{#NAME}])\n  -\n  min(/Template App OpenClaw Gateway/openclaw.liveness.warnings.total[{#NAME}],15m)\n)>={$OPENCLAW_LIVENESS_WARNINGS_WARN}\n"
              name: 'OpenClaw [{#NAME}]: Liveness warnings detected'
              priority: INFO
              tags:
                - tag: scope
                  value: performance
            - uuid: 91c228e4cd2d4d9c871f17a83a6a71ac
              expression: "min(/Template App OpenClaw Gateway/openclaw.prometheus.metrics_present[{#NAME}],15m)=1\nand\n(\n  last(/Template App OpenClaw Gateway/openclaw.memory.pressure.total[{#NAME}])\n  -\n  min(/Template App OpenClaw Gateway/openclaw.memory.pressure.total[{#NAME}],15m)\n)>={$OPENCLAW_MEMORY_PRESSURE_WARN}\n"
              name: 'OpenClaw [{#NAME}]: Memory pressure detected'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: capacity
            - uuid: be4cbdb17600475a85f6c468ebe5d7b6
              expression: "min(/Template App OpenClaw Gateway/openclaw.prometheus.metrics_present[{#NAME}],10m)=1\nand\n(\n  last(/Template App OpenClaw Gateway/openclaw.messages.delivery.errors.total[{#NAME}])\n  -\n  min(/Template App OpenClaw Gateway/openclaw.messages.delivery.errors.total[{#NAME}],10m)\n)>={$OPENCLAW_MESSAGE_ERRORS_WARN}\n"
