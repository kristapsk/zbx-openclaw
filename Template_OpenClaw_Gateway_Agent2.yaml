      macros:
        - macro: '{$OPENCLAW_COST_DAILY_WARN_USD}'
          value: '0'
          description: 'Daily model-cost warning threshold in USD. Zero disables the trigger.'
        - macro: '{$OPENCLAW_INSTANCES_FILE}'
          value: /etc/zabbix/openclaw.instances.json
          description: 'JSON file of extra OpenClaw instances. Missing or empty = only the default instance.'
        - macro: '{$OPENCLAW_HEALTH_PATH}'
          value: /health
          description: 'Unauthenticated OpenClaw liveness endpoint.'
        - macro: '{$OPENCLAW_HOST}'
          value: 127.0.0.1
          description: 'Host or interface used by local agent-executed HTTP checks.'
        - macro: '{$OPENCLAW_LATENCY_WARN_MS}'
          value: '500'
          description: 'Five-minute average health latency warning threshold in milliseconds.'
        - macro: '{$OPENCLAW_LIVENESS_WARNINGS_WARN}'
          value: '5'
          description: 'New liveness warnings within fifteen minutes required to create an information event.'
        - macro: '{$OPENCLAW_MEMORY_PRESSURE_WARN}'
          value: '2'
          description: 'New memory-pressure events within fifteen minutes required to trigger an average-severity event.'
        - macro: '{$OPENCLAW_MESSAGE_ERRORS_WARN}'
          value: '5'
          description: 'New message processing or delivery errors within ten minutes required to trigger a warning.'
        - macro: '{$OPENCLAW_MODEL_ERRORS_WARN}'
          value: '3'
          description: 'New model call errors within ten minutes required to trigger a warning.'
        - macro: '{$OPENCLAW_MODEL_FAILOVERS_WARN}'
          value: '3'
          description: 'New model failovers within fifteen minutes required to trigger a warning.'
        - macro: '{$OPENCLAW_PORT}'
          value: '18789'
          description: 'OpenClaw Gateway TCP port.'
        - macro: '{$OPENCLAW_PROMETHEUS_INTERVAL}'
          value: 1m
          description: 'Prometheus scrape interval.'
        - macro: '{$OPENCLAW_PROMETHEUS_PATH}'
          value: /api/diagnostics/prometheus
          description: 'Path registered by the optional diagnostics-prometheus plugin.'
        - macro: '{$OPENCLAW_PROMETHEUS_REQUIRED}'
          value: '0'
          description: 'Set to 1 to alert when optional Prometheus telemetry is unavailable or empty.'
        - macro: '{$OPENCLAW_PROMETHEUS_TOKEN_FILE}'
          value: /etc/zabbix/secrets/openclaw_gateway_token
          description: 'File containing the Gateway token or password used as a Bearer credential.'
        - macro: '{$OPENCLAW_QUEUE_DEPTH_WARN}'
          value: '10'
          description: 'Session queue depth warning threshold.'
        - macro: '{$OPENCLAW_STUCK_SESSIONS_WARN}'
          value: '2'
          description: 'New stuck-session events within fifteen minutes required to trigger an average-severity event.'
        - macro: '{$OPENCLAW_TOOL_BLOCKED_WARN}'
          value: '3'
          description: 'New blocked tool executions within ten minutes required to create an information event.'
        - macro: '{$OPENCLAW_TOOL_ERRORS_WARN}'
          value: '5'
          description: 'New tool execution errors within ten minutes required to trigger a warning.'
  triggers:
    - uuid: 958cd03e98ab495489c276079c20cf08
      expression: '{$OPENCLAW_COST_DAILY_WARN_USD}>0 and last(/Template App OpenClaw Gateway/openclaw.prometheus.metrics_present)=1 and (last(/Template App OpenClaw Gateway/openclaw.model.cost.usd.total)-min(/Template App OpenClaw Gateway/openclaw.model.cost.usd.total,1d))>{$OPENCLAW_COST_DAILY_WARN_USD}'
      name: 'OpenClaw: Daily model cost is high'
      priority: WARNING
      description: 'Disabled by default. Set {$OPENCLAW_COST_DAILY_WARN_USD} to a positive amount to enable it.'
      tags:
        - tag: scope
          value: capacity
    - uuid: 0df17690641c4f7db3699a535eef8cf9
      expression: |
        min(/Template App OpenClaw Gateway/openclaw.prometheus.metrics_present,10m)=1
        and
        (
          last(/Template App OpenClaw Gateway/openclaw.diagnostics.queue.dropped.total)
          -
          min(/Template App OpenClaw Gateway/openclaw.diagnostics.queue.dropped.total,10m)
        )>0
      name: 'OpenClaw: Diagnostic events are being dropped'
      priority: WARNING
      tags:
        - tag: scope
          value: capacity
    - uuid: f0e1d2c3b4a5498899aabbccddeeff01
      expression: 'max(/Template App OpenClaw Gateway/openclaw.http.health["http://{$OPENCLAW_HOST}:{$OPENCLAW_PORT}{$OPENCLAW_HEALTH_PATH}"],3m)=0 and last(/Template App OpenClaw Gateway/net.tcp.listen[{$OPENCLAW_PORT}])=1'
      name: 'OpenClaw: Health endpoint is failing'
      priority: HIGH
      description: 'The Gateway port is listening, but the health endpoint has not returned HTTP 200 for three minutes.'
      tags:
        - tag: scope
          value: availability
    - uuid: 0aa1bb2c3dd4478899aabbccddeeff02
      expression: 'avg(/Template App OpenClaw Gateway/openclaw.http.latency_ms["http://{$OPENCLAW_HOST}:{$OPENCLAW_PORT}{$OPENCLAW_HEALTH_PATH}"],5m)>{$OPENCLAW_LATENCY_WARN_MS} and last(/Template App OpenClaw Gateway/openclaw.http.health["http://{$OPENCLAW_HOST}:{$OPENCLAW_PORT}{$OPENCLAW_HEALTH_PATH}"])=1'
