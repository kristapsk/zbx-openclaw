      discovery_rules:
        - uuid: 5950c69d90674e3e88e41f276a083172
          name: OpenClaw extra instances
          type: ZABBIX_ACTIVE
          key: openclaw.discovery[{$OPENCLAW_INSTANCES_FILE}]
          delay: 5m
          lifetime: 7d
          description: Additional OpenClaw Gateway instances on this host. The default instance stays on the static items/macros. A missing file yields an empty list and creates nothing.
          item_prototypes:
            - uuid: d7dd25c35221434b89191bddadd5e622
              name: 'OpenClaw [{#NAME}]: TCP port listening'
              type: ZABBIX_ACTIVE
              key: net.tcp.listen[{#PORT}]
              delay: 30s
              history: 7d
              description: Returns 1 when the configured Gateway TCP port is listening locally.
              tags:
                - tag: component
                  value: availability
                - tag: instance
                  value: '{#NAME}'
            - uuid: 0f23d4bcfb894fe78f339a54dd8d3ea5
              name: 'OpenClaw [{#NAME}]: Diagnostic events dropped, total'
              type: DEPENDENT
              key: openclaw.diagnostics.queue.dropped.total[{#NAME}]
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - openclaw_diagnostic_async_queue_dropped_total
                    - function
                    - sum
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: openclaw.prometheus["http://{#HOST}:{#PORT}{#PROMETHEUS_PATH}","{#TOKEN_FILE}"]
              tags:
                - tag: component
                  value: telemetry
                - tag: instance
                  value: '{#NAME}'
            - uuid: 3dd0a674499948d881989b98065fa0fe
              name: 'OpenClaw [{#NAME}]: Diagnostic queue length'
              type: DEPENDENT
              key: openclaw.diagnostics.queue.length[{#NAME}]
              history: 7d
              value_type: FLOAT
