zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: b9b4a6c2c6ff4c36a6c1f2cb0b2b11a1
      name: Templates/Applications
  templates:
    - uuid: 7d9fd7e1b2b9456a9e5d3a1bcb7a5f10
      template: 'Template App OpenClaw Gateway'
      name: 'Template App OpenClaw Gateway'
      description: |
        Monitors a locally running OpenClaw Gateway with Zabbix agent2 active checks.
        
        Basic TCP and HTTP health monitoring works without the optional
        diagnostics-prometheus plugin. When that plugin is enabled, additional
        operational, usage, queue, memory and error metrics are collected from
        its authenticated Prometheus endpoint.
        
        A single Gateway needs only the host macros. Extra instances on the
        same host are discovered from {$OPENCLAW_INSTANCES_FILE}. A missing or
        empty file creates no extra items.
        
        
        
        
        
        
      groups:
        - name: Templates/Applications
      items:
        - uuid: 9f7e9f1a9a6c4d0ebc6b8a9f3e1c2d31
          name: 'OpenClaw: TCP port listening'
          type: ZABBIX_ACTIVE
          key: 'net.tcp.listen[{$OPENCLAW_PORT}]'
          delay: 30s
          history: 7d
          description: 'Returns 1 when the configured Gateway TCP port is listening locally.'
          tags:
            - tag: component
              value: availability
          triggers:
            - uuid: a4c3b2d1e0f84d1b9c8a7b6c5d4e3f21
              expression: 'max(/Template App OpenClaw Gateway/net.tcp.listen[{$OPENCLAW_PORT}],2m)=0'
              name: 'OpenClaw: Gateway port is not listening'
              priority: HIGH
              description: 'The OpenClaw Gateway port has not been listening for two minutes.'
              tags:
                - tag: scope
                  value: availability
        - uuid: e380b71d90fd4814b146946387d23395
          name: 'OpenClaw: Diagnostic events dropped, total'
          type: DEPENDENT
          key: openclaw.diagnostics.queue.dropped.total
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - openclaw_diagnostic_async_queue_dropped_total
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'openclaw.prometheus["http://{$OPENCLAW_HOST}:{$OPENCLAW_PORT}{$OPENCLAW_PROMETHEUS_PATH}","{$OPENCLAW_PROMETHEUS_TOKEN_FILE}"]'
          tags:
            - tag: component
              value: telemetry
        - uuid: a94743699a8441b8afdce3970456478a
          name: 'OpenClaw: Diagnostic queue length'
          type: DEPENDENT
          key: openclaw.diagnostics.queue.length
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - openclaw_diagnostic_async_queue_length
                - value
                - ''
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'openclaw.prometheus["http://{$OPENCLAW_HOST}:{$OPENCLAW_PORT}{$OPENCLAW_PROMETHEUS_PATH}","{$OPENCLAW_PROMETHEUS_TOKEN_FILE}"]'
          tags:
            - tag: component
              value: telemetry
        - uuid: 1b2c3d4e5f6a4789a0b1c2d3e4f5a6b1
          name: 'OpenClaw: HTTP health endpoint OK'
          type: ZABBIX_ACTIVE
          key: 'openclaw.http.health["http://{$OPENCLAW_HOST}:{$OPENCLAW_PORT}{$OPENCLAW_HEALTH_PATH}"]'
          delay: 30s
          history: 7d
          description: 'Returns 1 when the local OpenClaw health endpoint returns HTTP 200.'
          tags:
            - tag: component
              value: health
        - uuid: 8a7b6c5d4e3f4210b1c2d3e4f5a6b7c8
          name: 'OpenClaw: HTTP health latency'
          type: ZABBIX_ACTIVE
          key: 'openclaw.http.latency_ms["http://{$OPENCLAW_HOST}:{$OPENCLAW_PORT}{$OPENCLAW_HEALTH_PATH}"]'
          delay: 30s
          history: 7d
          units: ms
          description: 'Local HTTP response time of the OpenClaw health endpoint.'
          tags:
            - tag: component
